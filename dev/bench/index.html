<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benchmarks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Departure+Mono&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Departure Mono', monospace;
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .inner { width: 100%; max-width: 680px; }

      .metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-bottom: 2.5rem; }
      .metric { background: #f5f5f2; border-radius: 8px; padding: 1.25rem 1.5rem; }
      .metric-label { font-size: 13px; color: #888780; margin-bottom: 0.5rem; }
      .metric-value { font-size: 2.5rem; color: #1a1a18; }
      .metric-unit { font-size: 13px; color: #5f5e5a; margin-top: 0.25rem; }

      .graph-label { font-size: 13px; color: #888780; margin-bottom: 0.75rem; }
      .chart-wrap { position: relative; width: 100%; height: 200px; margin-bottom: 2rem; }
    </style>
  </head>
  <body>
    <div class="inner">
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">total parse time</div>
          <div class="metric-value" id="val-time">—</div>
          <div class="metric-unit">faacifp dataset</div>
        </div>
        <div class="metric">
          <div class="metric-label">throughput</div>
          <div class="metric-value" id="val-iters">—</div>
          <div class="metric-unit">iter/sec</div>
        </div>
      </div>

      <div class="graph-label">total parse time</div>
      <div class="chart-wrap"><canvas id="chart-time"></canvas></div>
      <div class="graph-label">iter/sec</div>
      <div class="chart-wrap"><canvas id="chart-iters"></canvas></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="data.js"></script>
    <script>
    (function () {
      const TARGET = 'test_faacifp_benchmark';
      const RAW = window.BENCHMARK_DATA;

      function parseMean(extra) {
        if (!extra) return null;
        const m = extra.match(/mean:\s*([\d.e+\-]+)\s*(nsec|usec|msec|sec)/);
        if (!m) return null;
        const v = parseFloat(m[1]), u = m[2];
        if (u === 'nsec') return v / 1e9;
        if (u === 'usec') return v / 1e6;
        if (u === 'msec') return v / 1e3;
        return v;
      }

      function fmtSec(v) {
        if (v === null || isNaN(v)) return '—';
        if (v < 0.001) return (v * 1e6).toFixed(1) + ' µs';
        if (v < 1)     return (v * 1000).toFixed(1) + ' ms';
        return v.toFixed(2) + ' s';
      }

      function fmtIter(v) {
        if (v === null || isNaN(v)) return '—';
        if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
        if (v >= 1e3) return (v / 1e3).toFixed(2) + 'k';
        return v.toFixed(3);
      }

      function avg(arr) {
        const v = arr.filter(x => x !== null && !isNaN(x));
        return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      }

      const allEntries = Object.values(RAW.entries).flat();
      const labels = [], timeVals = [], iterVals = [];
      const seen = new Set();

      for (const entry of allEntries) {
        const id = entry.commit.id;
        if (seen.has(id)) continue;
        const bench = entry.benches.find(b => b.name.includes(TARGET));
        if (!bench) continue;
        seen.add(id);
        labels.push(id.slice(0, 7));
        timeVals.push(parseMean(bench.extra));
        iterVals.push(bench.value ?? null);
      }

      document.getElementById('val-time').textContent  = fmtSec(avg(timeVals));
      document.getElementById('val-iters').textContent = fmtIter(avg(iterVals));

      const chartDefaults = (data, fmtFn) => ({
        type: 'line',
        data: {
          labels,
          datasets: [{
            data,
            borderColor: '#888780',
            backgroundColor: 'rgba(136,135,128,0.07)',
            pointBackgroundColor: '#888780',
            pointRadius: 5,
            pointHoverRadius: 7,
            borderWidth: 1.5,
            tension: 0.3,
            fill: true,
            spanGaps: true,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                title: items => items[0].label,
                label: item => ' ' + (item.raw !== null ? fmtFn(item.raw) : '—')
              },
              bodyFont: { family: 'Departure Mono' },
              titleFont: { family: 'Departure Mono' },
              backgroundColor: 'rgba(0,0,0,0.75)',
              padding: 10,
              cornerRadius: 4,
            }
          },
          scales: {
            x: {
              ticks: { font: { family: 'Departure Mono', size: 12 }, color: '#888780', autoSkip: false },
              grid: { color: 'rgba(136,135,128,0.12)' },
              border: { color: 'rgba(136,135,128,0.2)' }
            },
            y: {
              ticks: { font: { family: 'Departure Mono', size: 12 }, color: '#888780', callback: v => fmtFn(v) },
              grid: { color: 'rgba(136,135,128,0.12)' },
              border: { color: 'rgba(136,135,128,0.2)' },
              beginAtZero: true
            }
          }
        }
      });

      new Chart(document.getElementById('chart-time'),  chartDefaults(timeVals, fmtSec));
      new Chart(document.getElementById('chart-iters'), chartDefaults(iterVals, fmtIter));
    })();
    </script>
  </body>
</html>
